  title:
    en: Fuel prices — the ranking of Italian provinces
    it: Carburanti — la classifica delle province
    es: Combustibles — la clasificación de las provincias
  summary:
    en: With Instant Analytics. A dashboard that rebuilds itself every morning from the Ministry's Osservaprezzi
      data on more than 20,000 stations, with a ranking and map of all 110 provinces, the self-service vs
      full-service gap, brand comparison and the price distribution (in Italian).
    it: Con Instant Analytics. Dashboard che si ricostruisce da sola ogni mattina sui dati MIMIT Osservaprezzi di
      oltre 20.000 impianti, con classifica e mappa delle 110 province, divario fra self e servito, confronto fra
      bandiere e distribuzione dei prezzi.
    es: Con Instant Analytics. Panel que se reconstruye solo cada mañana con los datos del Osservaprezzi del
      MIMIT de más de 20.000 gasolineras, con clasificación y mapa de las 110 provincias, diferencia entre
      autoservicio y servicio asistido, comparación entre marcas y distribución de precios (en italiano).
  stack: HTML/JS · MIMIT Osservaprezzi open data · automated daily pipeline

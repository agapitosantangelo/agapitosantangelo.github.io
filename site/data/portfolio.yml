  title:
    en: Climate Observatory — Italian municipalities, 1951–2025
    it: Osservatorio clima — comuni italiani, 1951–2025
    es: Observatorio del clima — municipios italianos, 1951–2025
  summary:
    en: Seventy-five years of temperature, precipitation and snowfall for all 7,903 Italian municipalities from the
      ERA5-Land reanalysis, shown as anomalies against 1961–1990, with a year slider, municipal series with trend,
      and warming by elevation band and region.
    it: Settantacinque anni di temperatura, precipitazione e neve per tutti i 7.903 comuni italiani dalla rianalisi
      ERA5-Land, mostrati come anomalie rispetto al 1961–1990, con slider temporale, serie per comune con tendenza
      e riscaldamento per fascia altimetrica e regione.
    es: Setenta y cinco años de temperatura, precipitación y nieve para los 7.903 municipios italianos a partir del
      reanálisis ERA5-Land, mostrados como anomalías respecto a 1961–1990, con control temporal, series por municipio
      con tendencia y calentamiento por franja altitudinal y región.
  stack: MapLibre GL · ERA5-Land (Copernicus C3S) · Google Earth Engine · ISTAT · Python

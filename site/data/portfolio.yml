- id: alluvione
  status: published
  status_label:
    en: Live · 2026
    it: Online · 2026
    es: En línea · 2026
  title:
    en: Reading a flood from space — Emilia-Romagna, May 2023
    it: Leggere un'alluvione dallo spazio — Emilia-Romagna, maggio 2023
    es: Leer una inundación desde el espacio — Emilia-Romaña, mayo de 2023
  summary:
    en: 'A story map from the satellite pixel to the economic ledger: Maxar before/after imagery, a calibrated sediment
      mask validated against the Copernicus EMS footprint, landslide candidates in the hills, exposure of buildings
      and services, the null result on annual income and population, and the transitory discount on house prices
      by OMI zone.'
    it: 'Una mappa narrativa dal pixel satellitare ai dati economici: immagini Maxar prima/dopo, maschera del sedimento
      calibrata e validata sulla perimetrazione Copernicus EMS, frane candidate in collina, esposizione di edifici
      e servizi, il risultato nullo su reddito e popolazione annuali e lo sconto transitorio sui prezzi delle case
      per zona OMI.'
    es: 'Un mapa narrativo del píxel satelital a los datos económicos: imágenes Maxar antes/después, máscara de
      sedimentos calibrada y validada con la delimitación de Copernicus EMS, deslizamientos candidatos en las colinas,
      exposición de edificios y servicios, el resultado nulo sobre renta y población anuales y el descuento transitorio
      en los precios de la vivienda por zona OMI.'
  stack: MapLibre GL · Maxar Open Data · Copernicus EMS · Overture Maps · OMI · Python/GDAL
  image: assets/portfolio/alluvione.jpg
  links:
  - label:
      en: Open the story map
      it: Apri la mappa narrativa
      es: Abrir el mapa narrativo
    url: https://agapitosantangelo.github.io/flood/
  - label: GitHub
    url: https://github.com/agapitosantangelo/flood

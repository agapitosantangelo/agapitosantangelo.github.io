  title:
    en: Night Lights Observatory — Italian municipalities, 2012–2024
    it: Osservatorio luci notturne — comuni italiani, 2012–2024
    es: Observatorio de luces nocturnas — municipios italianos, 2012–2024
  summary:
    en: Interactive map of night-time light radiance for all 7,903 Italian municipalities from NASA Black Marble, with
      a year slider, municipal time series, growth and decline by inner-area (SNAI) class, and the key results of my
      ongoing work on whether night light measures inequality.
    it: Mappa interattiva della radianza notturna di tutti i 7.903 comuni italiani dai dati NASA Black Marble, con
      slider temporale, serie storica per comune, crescita e declino per classe di area interna (SNAI) e i risultati
      principali del mio lavoro in corso su luce notturna e disuguaglianza.
    es: Mapa interactivo de la radiancia nocturna de los 7.903 municipios italianos a partir de NASA Black Marble, con
      control temporal, series por municipio, crecimiento y declive por clase de área interna (SNAI) y los resultados
      principales de mi trabajo en curso sobre luz nocturna y desigualdad.
  stack: MapLibre GL · NASA Black Marble VNP46A4 · ISTAT · SNAI · Python
  image: assets/portfolio/nightlights.png

- id: alluvione
  status: ongoing
  status_label:
    en: In progress
    it: In lavorazione
    es: En preparación
  title:
    en: Emilia-Romagna 2023 flood — detecting the event from satellite imagery and measuring its footprint
    it: Alluvione Emilia-Romagna 2023 — rilevare l'evento dalle immagini satellitari e misurarne l'impronta
    es: Inundación de Emilia-Romaña 2023 — detectar el evento desde imágenes satelitales y medir su huella
  summary:
    en: Very-high-resolution Maxar Open Data imagery before and after the May 2023 flood, a calibrated sediment
      mask and landslide detection, validated against the Copernicus EMS delineation, then exposure of buildings
      and services (Overture) and the effect on real-estate prices by OMI zone. Interactive map coming soon.
    it: Immagini Maxar Open Data ad altissima risoluzione prima e dopo l'alluvione del maggio 2023, maschera
      calibrata del sedimento e rilevamento delle frane, validati sulla perimetrazione Copernicus EMS, poi
      esposizione di edifici e servizi (Overture) ed effetto sui prezzi immobiliari per zona OMI. Mappa
      interattiva in arrivo.
    es: Imágenes Maxar Open Data de muy alta resolución antes y después de la inundación de mayo de 2023,
      máscara calibrada de sedimentos y detección de deslizamientos, validadas con la delimitación de
      Copernicus EMS, y después exposición de edificios y servicios (Overture) y efecto en los precios
      inmobiliarios por zona OMI. Mapa interactivo próximamente.
  stack: Maxar Open Data · Copernicus EMS · Overture Maps · OMI · Python/GDAL
  image: assets/portfolio/alluvione.jpg

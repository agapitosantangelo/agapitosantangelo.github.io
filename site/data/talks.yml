  title: "Determinanti della sostenibilità finanziaria dei comuni del Lazio"
  venue:
    en: |-
      University of Valle d'Aosta · Polo Universitario, Via Monte Vodice · 28 April 2026.
      Paper presented at the seminar «Raccontare il territorio attraverso la statistica pubblica: ruolo e offerta di Regioni e Istat» (Aosta, 27–28 April 2026), promoted by the Italian Inter-Regional Statistical Coordination (CSI) and Istat. Joint work with Viviana Borzetti (Regional Statistics Office — Lazio Region), under the cooperation agreement between Lazio Region and the University of Molise.
    it: |-
      Università della Valle d'Aosta · Polo Universitario, Via Monte Vodice · 28 aprile 2026.
      Relazione presentata nell'ambito del seminario «Raccontare il territorio attraverso la statistica pubblica: ruolo e offerta di Regioni e Istat» (Aosta, 27–28 aprile 2026), promosso dal Coordinamento Statistico Interregionale e dall'Istat. Lavoro congiunto con Viviana Borzetti (Ufficio regionale di statistica - Regione Lazio), nell'ambito del Protocollo d'Intesa tra Regione Lazio e Università del Molise.
    es: |-
      Universidad de Valle d'Aosta · Polo Universitario, Via Monte Vodice · 28 abril 2026.
      Ponencia presentada en el seminario «Raccontare il territorio attraverso la statistica pubblica: ruolo e offerta di Regioni e Istat» (Aosta, 27–28 abril 2026), organizado por el Coordinamento Statistico Interregionale (CSI) e Istat. Trabajo conjunto con Viviana Borzetti (Oficina regional de estadística — Región del Lazio), en el marco del Acuerdo de cooperación entre la Región del Lazio y la Universidad de Molise.

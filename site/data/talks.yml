    es: |-
      AISRe 2026 — XLVII Conferencia Científica Anual de la Asociación Italiana de Ciencia Regional · Universidad de Florencia, Campus de Novoli · 24–26 de junio de 2026.
      Trabajo sobre captura administrativa y calidad de las instituciones (con N. Caravaggio y G. Resce), en el marco del tema «Regiones entre innovación y sostenibilidad: los retos para las políticas de desarrollo».

- id: territori-foggia-2026
  year: 2026
  date:
    en: "20–21 February 2026"
    it: "20–21 febbraio 2026"
    es: "20–21 febrero 2026"
  role:
    en: "Presenter"
    it: "Relatore"
    es: "Ponente"
  title: "Le transizioni nei sistemi territoriali"
  venue:
    en: |-
      University of Foggia — Department of Economics · Aula Magna “V. Spada” · 20–21 February 2026.
      Two-day conference on environmental and digital transitions, the Apulian economy, and the inner-areas / urban divide. Day 2 is held in English with a more technical focus.
    it: |-
      Università degli Studi di Foggia — Dipartimento di Economia · Aula Magna “V. Spada” · 20–21 febbraio 2026.
      Convegno di due giornate su transizioni ambientali e digitali, economia pugliese, e divario fra aree interne e aree urbane. La seconda giornata si svolge in lingua inglese con taglio più tecnico.
    es: |-
      Universidad de Foggia — Departamento de Economía · Aula Magna “V. Spada” · 20–21 febrero 2026.
      Congreso de dos jornadas sobre transiciones ambientales y digitales, economía de Apulia, y brecha entre áreas internas y urbanas. La segunda jornada se realiza en inglés con enfoque más técnico.
  photos:
    - src: "assets/photos/talk-territori-2026.jpg"
      alt:
        en: "Presenting at Le transizioni nei sistemi territoriali, University of Foggia, February 2026"
        it: "Presentazione a Le transizioni nei sistemi territoriali, Università di Foggia, febbraio 2026"
        es: "Presentación en Le transizioni nei sistemi territoriali, Universidad de Foggia, febrero 2026"
      caption:
        en: "Talk on digital indicators of territorial dynamics — Le transizioni nei sistemi territoriali, University of Foggia, 20–21 February 2026."
        it: "Talk sugli indicatori digitali delle dinamiche territoriali — Le transizioni nei sistemi territoriali, Università di Foggia, 20–21 febbraio 2026."
        es: "Charla sobre indicadores digitales de la dinámica territorial — Le transizioni nei sistemi territoriali, Universidad de Foggia, 20–21 febrero 2026."
  link: "https://www.economia.unifg.it/it/tutte-le-iniziative/le-transizioni-nei-sistemi-territoriali"


lead:
  it: "Sono un economista applicato: valuto le politiche pubbliche con inferenza causale, dati digitali non convenzionali e machine learning."
  en: "I am an applied economist: I evaluate public policies with causal inference, unconventional digital data and machine learning."
  es: "Soy un economista aplicado: evalúo políticas públicas con inferencia causal, datos digitales no convencionales y machine learning."
bio:
  - it: "Gran parte del mio lavoro recente studia come la digitalizzazione trasforma il settore pubblico — dai fondi di coesione europei ai servizi digitali dei comuni — con disegni difference-in-differences, dati panel e tracce digitali d'archivio. Mi occupo anche di sanità, istituzioni e dinamiche territoriali."
    en: "Much of my recent work studies how digitalisation transforms the public sector — from EU cohesion funds to municipal digital services — using difference-in-differences designs, panel data and archived web traces. I also work on health, institutions and territorial dynamics."
    es: "Gran parte de mi trabajo reciente estudia cómo la digitalización transforma el sector público — de los fondos de cohesión europeos a los servicios digitales municipales — con diseños difference-in-differences, datos de panel y trazas digitales de archivo. También trabajo sobre sanidad, instituciones y dinámicas territoriales."
  - it: "Lavoro inoltre come Data Analysis Strategist per Instant Analytics, applicando text mining e machine learning al monitoraggio in tempo reale di fenomeni socioeconomici: un complemento utile alla ricerca accademica, perché mostra come questi metodi si comportano nella pratica."
    en: "I also work as a Data Analysis Strategist at Instant Analytics, applying text mining and machine learning to real-time monitoring of socioeconomic phenomena: a useful complement to my academic research, because it shows how these methods behave in practice."
    es: "Trabajo además como Data Analysis Strategist en Instant Analytics, aplicando text mining y machine learning al seguimiento en tiempo real de fenómenos socioeconómicos: un complemento útil a mi investigación académica, porque muestra cómo se comportan estos métodos en la práctica."
  - it: "Ho conseguito il dottorato in Economia all'Università del Molise con menzione Doctor Europaeus, con un periodo da visiting scholar alla Universitat Politècnica de València. Sono revisore per PLOS ONE."
    en: "I hold a PhD in Economics from the University of Molise with the Doctor Europaeus distinction, including a visiting period at the Universitat Politècnica de València. I serve as a reviewer for PLOS ONE."
    es: "Soy doctor en Economía por la Universidad de Molise con mención Doctor Europaeus, con una estancia como visiting scholar en la Universitat Politècnica de València. Soy revisor de PLOS ONE."

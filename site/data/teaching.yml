      it: "Feb 2025"
      es: "Feb 2025"
    role:
      en: "Lecturer — Digital Economy and Digital Methods"
      it: "Docente — Economia Digitale e Metodi Digitali"
      es: "Docente — Economía Digital y Métodos Digitales"
    org:
      en: "Sviluppo Italia Molise · Targeted Training Programme"
      it: "Sviluppo Italia Molise · Programma di formazione mirata"

    description:
      en: "Lectures on the economics of digital platforms and on practical digital methods (web scraping, text mining, basic machine learning) for policy and business analysis. Hands-on case studies on real-time monitoring of public services and territorial dynamics."
      it: "Lezioni sull'economia delle piattaforme digitali e su metodi digitali pratici (web scraping, text mining, machine learning di base) per l'analisi delle politiche pubbliche e dei contesti aziendali. Casi studio applicati al monitoraggio in tempo reale dei servizi pubblici e delle dinamiche territoriali."
      es: "Clases sobre la economía de las plataformas digitales y sobre métodos digitales aplicados (web scraping, text mining, machine learning básico) para el análisis de políticas y empresas. Casos prácticos sobre el seguimiento en tiempo real de servicios públicos y dinámica territorial."
    keywords:
      en: "Digital economy · Digital methods · Data-driven policy analysis"
      it: "Economia digitale · Metodi digitali · Analisi delle politiche"
      es: "Economía digital · Métodos digitales · Análisis de políticas"

philosophy:
  en: "A good empirical economist needs to be fluent in three languages at once: theory, code, and the institutional details of the policy being studied. None of the three is optional."
  it: "Un buon economista empirico deve parlare contemporaneamente tre lingue: teoria, codice e dettagli istituzionali della politica oggetto di studio. Nessuna delle tre è opzionale."
  es: "Un buen economista empírico debe hablar simultáneamente tres lenguas: teoría, código y detalles institucionales de la política objeto de estudio. Ninguna de las tres es opcional."

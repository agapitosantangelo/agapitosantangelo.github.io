university:
  - id: microeconomics
    current: true
    period:
      en: "Dec 2023 — Present"
      it: "Dic 2023 — In corso"
      es: "Dic 2023 — Actualidad"
    role:
      en: "Cultore della Materia — Microeconomics"
      it: "Cultore della Materia — Microeconomia"
      es: "Cultore della Materia — Microeconomía"
    org:
      en: "University of Molise · Department of Economics\nCourse held by Prof. Giuliano Resce"
      it: "Università del Molise · Dipartimento di Economia\nCorso tenuto dal Prof. Giuliano Resce"
      es: "Universidad de Molise · Departamento de Economía\nCurso impartido por el Prof. Giuliano Resce"
    description:
      en: "Recitations and seminars on consumer theory, producer theory, market structures and welfare analysis. Office hours, examination-board participation and exam preparation support, with attention to connecting theoretical concepts to empirical and policy-relevant examples."
      it: "Esercitazioni e seminari su teoria del consumatore, teoria della produzione, strutture di mercato e analisi del benessere. Ricevimenti, partecipazione alle commissioni d'esame e supporto alla preparazione degli esami, con attenzione al collegamento fra concetti teorici ed esempi empirici e di policy."
      es: "Sesiones prácticas y seminarios sobre teoría del consumidor, teoría de la producción, estructuras de mercado y análisis del bienestar. Tutorías, participación en tribunales de examen y apoyo a la preparación de los exámenes, con atención a la conexión entre conceptos teóricos y ejemplos empíricos y de política."
    keywords:
      en: "Microeconomics · Economics education"
      it: "Microeconomia · Didattica dell'economia"
      es: "Microeconomía · Educación en economía"


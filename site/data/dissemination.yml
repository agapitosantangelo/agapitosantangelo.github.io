- heading:
    en: Interactive dashboards
    it: Dashboard interattive
    es: Paneles interactivos
  items:
  - tag: Dashboard
    title:
      en: World Cup 2026 — who wins? Predictions from real data.
      it: Mondiale 2026 — chi vince? Previsioni con dati reali.
      es: Mundial 2026 — ¿quién gana? Predicciones con datos reales.
    venue:
      en: 'With Instant Analytics (Jun 2026). Interactive dashboard combining the official draw and FIFA rankings with 10,000 Monte Carlo tournament simulations: favourites, head-to-head comparisons, team paths and a simulated bracket, all running in the browser (English and Italian).  Open the dashboard →'
      it: 'Con Instant Analytics (giu 2026). Dashboard interattiva che combina il sorteggio ufficiale e il ranking FIFA con 10.000 simulazioni Monte Carlo del torneo: favoriti, testa a testa, percorso di ogni squadra e tabellone simulato, tutto nel browser.  Apri la dashboard →'
      es: 'Con Instant Analytics (jun 2026). Panel interactivo que combina el sorteo oficial y el ranking FIFA con 10.000 simulaciones Monte Carlo del torneo: favoritos, cara a cara, recorrido de cada selección y cuadro simulado, todo en el navegador (en inglés e italiano).  Abrir el panel →'
    links:
    - label: Instant Analytics
      url: https://www.instantanalytics.it/it/
    - label: Open the dashboard →
      url: https://agapitosantangelo.github.io/mondiale2026/en/

- id: proj-climate-security
  status: published
  status_label:
    en: "Concluded · 2021–2024"
    it: "Concluso · 2021–2024"
    es: "Concluido · 2021–2024"
  title: "Climate Security Observatory"
  summary:
    en: "Scientific support for the development of a permanent observatory on the climate crisis in Africa, hosted by the International Center for Tropical Agriculture (CIAT). The long-term goal is to migrate, onto a dynamic and policymaker-facing platform, the body of economic research conducted by the organisation on climate-change issues, making it operationally consultable for evidence-based decision-making."
    it: "Supporto scientifico allo sviluppo di un osservatorio permanente sulla crisi climatica in Africa, in capo all’International Center for Tropical Agriculture (CIAT). L’obiettivo di lungo periodo è trasferire su una piattaforma dinamica e consultabile dai decisori l’intero corpo di ricerca economica condotto dall’organizzazione sui temi del cambiamento climatico, rendendola operativamente fruibile per il decision-making evidence-based."
    es: "Apoyo científico al desarrollo de un observatorio permanente sobre la crisis climática en África, en el International Center for Tropical Agriculture (CIAT). El objetivo a largo plazo es trasladar a una plataforma dinámica y accesible para los responsables políticos todo el corpus de investigación económica realizado por la organización sobre el cambio climático, haciendo este conocimiento operativamente consultable para la toma de decisiones basada en evidencia."

- id: proj-sage-rise
  status: ongoing
  status_label:
    en: Ongoing · 2026–2028
    it: In corso · 2026–2028
    es: En curso · 2026–2028
  title:
    en: 'SAGE-Rise — Technological Solutions for Active Ageing: Validation in Real-world Settings (WP5, Data-driven
      Technologies for Evidence-based Policies)'
    it: 'SAGE-Rise — Soluzioni tecnologiche per l’invecchiamento attivo: validazione in contesti reali (WP5, Data-driven
      Technologies for Evidence-based Policies)'
    es: 'SAGE-Rise — Soluciones tecnológicas para el envejecimiento activo: validación en contextos reales (WP5,
      Data-driven Technologies for Evidence-based Policies)'
  summary:
    en: 'Twenty-four-month project of the SAGE-It programme (Smart Ageing and New Health Technologies in Italy,
      MUR D.D. 307/2025), the applied continuation of the national Age-It programme: it validates in real-world
      settings the technological and organisational solutions developed for healthy ageing and transfers them to
      the less developed regions of Southern Italy. Within WP5, led by the University of Molise, the work builds
      a territorial intelligence dashboard to monitor and forecast access to essential services in ageing communities:
      a taxonomy and validated indicators of spatial and social vulnerability; automated web-scraping and NLP pipelines
      on institutional websites, open data and social media, including indicators of how clearly services are communicated
      and perceived; integration of structured and unstructured data in a unified analytical environment; machine-learning
      models of future needs and service discontinuities in inner and isolated areas; and testing with municipalities,
      health districts and care homes.'
    it: 'Progetto di 24 mesi del programma SAGE-It (Smart Ageing and New Health Technologies in Italy, MUR D.D.
      307/2025), continuazione applicativa del programma nazionale Age-It: valida in contesti reali le soluzioni
      tecnologiche e organizzative sviluppate per l’invecchiamento in salute e le trasferisce alle regioni meno
      sviluppate del Mezzogiorno. Nel WP5, guidato dall’Università del Molise, l’attività costruisce una dashboard
      di intelligenza territoriale per monitorare e prevedere l’accessibilità ai servizi essenziali nelle comunità
      che invecchiano: tassonomia e indicatori validati di vulnerabilità spaziale e sociale; pipeline automatizzate
      di web scraping e NLP su siti istituzionali, open data e social media, con indicatori sulla chiarezza della
      comunicazione dei servizi e sulla loro percezione; integrazione di dati strutturati e non strutturati in un
      ambiente analitico unificato; modelli di machine learning sui bisogni futuri e sulle discontinuità dei servizi
      nelle aree interne e isolate; test con comuni, distretti socio-sanitari e RSA.'
    es: 'Proyecto de 24 meses del programa SAGE-It (Smart Ageing and New Health Technologies in Italy, MUR D.D.
      307/2025), continuación aplicada del programa nacional Age-It: valida en contextos reales las soluciones tecnológicas
      y organizativas desarrolladas para el envejecimiento saludable y las transfiere a las regiones menos desarrolladas
      del Sur de Italia. En el WP5, liderado por la Universidad de Molise, el trabajo construye un panel de inteligencia
      territorial para monitorizar y prever el acceso a los servicios esenciales en comunidades que envejecen: taxonomía
      e indicadores validados de vulnerabilidad espacial y social; pipelines automatizadas de web scraping y NLP
      sobre webs institucionales, datos abiertos y redes sociales, con indicadores sobre la claridad de la comunicación
      de los servicios y su percepción; integración de datos estructurados y no estructurados en un entorno analítico
      unificado; modelos de aprendizaje automático sobre necesidades futuras y discontinuidades de los servicios
      en áreas internas y aisladas; y pruebas con municipios, distritos sociosanitarios y residencias.'

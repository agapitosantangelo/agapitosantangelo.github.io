- id: proj-themia
  status: published
  status_label:
    en: "Concluded · 2024–2025"
    it: "Concluso · 2024–2025"
    es: "Concluido · 2024–2025"
  title: "THEMIA — THE Mood of Infrastructure’s Accessibility"
  summary:
    en: "Assesses infrastructural and territorial accessibility, addressing data challenges for both ex-ante and ex-post evaluations. The project combines real-time activity data from private platforms (Google, Meta, Telegram, X, LinkedIn) with traditional demographic and territorial sources. Machine Learning and Big Data Analytics generate innovative accessibility indicators and predictive models for socio-economic outcomes; user feedback from social networks is integrated into the analysis. Results are released as interactive maps designed for policymakers, practitioners, and citizens, providing a thorough and timely assessment of infrastructure-accessibility policies at the national level in Italy with granular territorial detail."
    it: "Valuta l’accessibilità infrastrutturale e territoriale, affrontando le sfide dei dati per valutazioni ex-ante ed ex-post. Combina dati di attività in tempo reale da piattaforme private (Google, Meta, Telegram, X, LinkedIn) con fonti demografiche e territoriali tradizionali. Machine Learning e Big Data Analytics generano indicatori innovativi di accessibilità e modelli predittivi per gli esiti socio-economici; il feedback degli utenti dai social network è integrato nell’analisi. I risultati sono restituiti tramite mappe interattive destinate a decisori, operatori e cittadini, garantendo una valutazione tempestiva e completa delle politiche di accessibilità infrastrutturale a livello nazionale italiano con dettaglio territoriale granulare."
    es: "Evalúa la accesibilidad infraestructural y territorial, abordando los retos de datos tanto en evaluaciones ex-ante como ex-post. Combina datos de actividad en tiempo real de plataformas privadas (Google, Meta, Telegram, X, LinkedIn) con fuentes demográficas y territoriales tradicionales. Machine Learning y Big Data Analytics generan indicadores innovadores de accesibilidad y modelos predictivos de resultados socioeconómicos; el feedback de los usuarios desde redes sociales se integra en el análisis. Los resultados se entregan mediante mapas interactivos destinados a responsables políticos, profesionales y ciudadanos, ofreciendo una evaluación exhaustiva y oportuna de las políticas de accesibilidad infraestructural a escala nacional italiana con detalle territorial granular."
  meta:
    funder:
      en: "European Union — NextGenerationEU"
      it: "Unione Europea — NextGenerationEU"
      es: "Unión Europea — NextGenerationEU"
    period:

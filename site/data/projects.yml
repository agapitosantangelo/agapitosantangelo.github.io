- id: proj-lazio-cpt
  status: ongoing
  status_label:
    en: Ongoing · 2025–2026
    it: In corso · 2025–2026
    es: En curso · 2025–2026
  title:
    en: Economic Sustainability of Lazio Municipalities — Territorial Public Accounts (CPT)
    it: Sostenibilità Economica dei Comuni Laziali — Conti Pubblici Territoriali
    es: Sostenibilidad Económica de los Municipios del Lacio — Cuentas Públicas Territoriales (CPT)
  summary:
    en: Twelve-month research project on the economic sustainability of municipalities in the Lazio region, framed
      within the Conti Pubblici Territoriali (Territorial Public Accounts) system. Activities include the update,
      integration and validation of Lazio CPT data; merging CPT and demographic sources into a unified dataset;
      estimating the spending theoretically required to guarantee constitutionally protected rights (health, education,
      mobility); building municipal-level sustainability indicators based on the balance between revenue effectively
      collected, expenditure effectively incurred and the spending needed; constructing measures of territorial
      cohesion and divergence within Lazio; and producing forecasting scenarios that combine official ISTAT demographic
      projections with constitutional-reform and public-investment hypotheses. Activities are partly conducted on-site
      at the Nucleo CPT Lazio premises in Rome.
    it: Progetto di ricerca di 12 mesi sulla valutazione della sostenibilità economica dei comuni laziali nell'ambito
      del sistema dei Conti Pubblici Territoriali (CPT). Le attività comprendono l'aggiornamento, l'integrazione
      e la validazione dei dati CPT del Lazio; l'integrazione di dati CPT e demografici in un unico dataset; la
      stima della spesa teoricamente necessaria ad assicurare i diritti costituzionalmente garantiti (salute, istruzione,
      mobilità); la costruzione di misure di sostenibilità comunale basate sull'equilibrio fra entrate effettivamente
      incassate, spesa effettivamente sostenuta e spesa teoricamente necessaria; misure di coesione e divergenza
      territoriale nel Lazio; e scenari di previsione che combinano le proiezioni demografiche ISTAT con ipotesi
      di riforma costituzionale e di pianificazione di investimenti pubblici. Le attività sono svolte parzialmente
      presso la sede del Nucleo CPT Lazio a Roma.
    es: Proyecto de investigación de 12 meses sobre la sostenibilidad económica de los municipios de la región del
      Lacio, en el marco del sistema de Conti Pubblici Territoriali (Cuentas Públicas Territoriales). Las actividades
      incluyen la actualización, integración y validación de los datos CPT del Lacio; la integración en un único
      conjunto de datos CPT y fuentes demográficas; la estimación del gasto teóricamente necesario para garantizar
      los derechos constitucionalmente protegidos (salud, educación, movilidad); la construcción de indicadores
      de sostenibilidad municipal basados en el equilibrio entre ingresos efectivamente percibidos, gasto efectivamente
      realizado y gasto necesario; medidas de cohesión o divergencia territorial en el Lacio; y escenarios de previsión
      que combinan las proyecciones demográficas oficiales del ISTAT con hipótesis de reforma constitucional y planificación
      de inversión pública. Parte de las actividades se desarrolla in situ en la sede del Nucleo CPT Lazio en Roma.

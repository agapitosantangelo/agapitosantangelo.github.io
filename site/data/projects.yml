      it: "Nucleo regionale CPT Lazio — FSC 2014–2020 «Rafforzamento del Sistema dei Conti Pubblici Territoriali» (Delibera CIPE n. 48/2017)"
      es: "Nucleo regional CPT Lazio — FSC 2014–2020 «Refuerzo del Sistema de Cuentas Públicas Territoriales» (Resolución CIPE n. 48/2017)"

  title:
    en: BACK IN TOWN — Industrial Relations and Social Dialogue for Youth Employment
    it: BACK IN TOWN — Relazioni Industriali e Dialogo Sociale per l'Occupazione Giovanile
    es: BACK IN TOWN — Relaciones Industriales y Diálogo Social para el Empleo Juvenil
  summary:
    en: EU-funded research collaboration on the role of industrial relations and social dialogue in supporting young
      people's employment and social inclusion at an urban level. The project covered analysis of the European labour
      market, of European strategies for youth employment and social inclusion, the production of evidence-based
      research reports, and the design and creation of an observatory on collective bargaining for young workers.
    it: Collaborazione di ricerca finanziata dall'UE sul ruolo delle relazioni industriali e del dialogo sociale
      a supporto dell'occupazione e dell'inclusione sociale dei giovani a livello urbano. Il progetto ha riguardato
      l'analisi del mercato del lavoro europeo, lo studio delle strategie europee a favore dell'occupazione giovanile
      e dell'inclusione sociale, la realizzazione di report di ricerca evidence-based e la progettazione di un osservatorio
      sulla contrattazione giovanile.
    es: Colaboración de investigación financiada por la UE sobre el papel de las relaciones industriales y el diálogo
      social en el apoyo al empleo y la inclusión social de los jóvenes a nivel urbano. El proyecto incluyó el análisis
      del mercado laboral europeo, el estudio de las estrategias europeas para el empleo juvenil y la inclusión
      social, la elaboración de informes de investigación basados en evidencia y el diseño de un observatorio sobre
      la negociación colectiva juvenil.

- id: proj-prin-health
  status: published
  status_label:
    en: "Concluded · 2023–2025"
    it: "Concluso · 2023–2025"
    es: "Concluido · 2023–2025"
  title:
    en: "Reconciling Efficiency and Equity in the Italian Healthcare System"
    it: "Conciliare Efficienza ed Equità nel Sistema Sanitario Italiano"
    es: "Conciliar Eficiencia y Equidad en el Sistema Sanitario Italiano"
  summary:
    en: "PRIN 2022 project evaluating the performance of the Italian regional healthcare system over the past two decades along the dimensions of efficiency and equity. Three focus areas: (1) hospital efficiency in the wake of the territorial reorganisation, distinguishing public and private providers and accounting for regional heterogeneity in population needs; (2) equity in access to hospital services through analysis of patient mobility across regions; (3) regional healthcare-expenditure allocation, comparing the central-level method currently in use with a needs-based alternative. The project applies state-of-the-art econometric methods and new microeconomics tools to inform the debate on decentralised healthcare."
    it: "Progetto PRIN 2022 di valutazione della performance del sistema sanitario regionale italiano negli ultimi venti anni lungo le dimensioni di efficienza ed equità. Tre aree di focus: (1) evoluzione dell’efficienza ospedaliera in seguito alla riorganizzazione territoriale, distinguendo strutture pubbliche e private e tenendo conto dell’eterogeneità regionale dei bisogni della popolazione; (2) equità nell’accesso ai servizi ospedalieri attraverso l’analisi della mobilità dei pazienti tra regioni; (3) allocazione della spesa sanitaria regionale, confrontando il metodo centrale attualmente in uso con un’alternativa basata sui bisogni. Il progetto applica metodi econometrici state-of-the-art e nuovi strumenti di microeconomia per alimentare il dibattito sul sistema sanitario decentrato."
    es: "Proyecto PRIN 2022 que evalúa el desempeño del sistema sanitario regional italiano de las últimas dos décadas en términos de eficiencia y equidad. Tres áreas de enfoque: (1) evolución de la eficiencia hospitalaria tras la reorganización territorial, distinguiendo proveedores públicos y privados y considerando la heterogeneidad regional de las necesidades poblacionales; (2) equidad en el acceso a los servicios hospitalarios mediante el análisis de la movilidad de pacientes entre regiones; (3) asignación del gasto sanitario regional, comparando el método central vigente con una alternativa basada en las necesidades. Aplica métodos econométricos de vanguardia y nuevas herramientas microeconómicas para alimentar el debate sobre el sistema sanitario descentralizado."

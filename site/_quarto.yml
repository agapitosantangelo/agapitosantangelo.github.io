project:
  type: website
  output-dir: _site
  pre-render: python3 tools/build_pages.py
  post-render: npx -y pagefind --site _site
  render:
    - index.qmd
    - it/
    - en/
    - es/
  resources:
    - assets
    - mondiale2026
    - robots.txt
    - google2b234cf325a53a14.html

website:
  title: "Agapito E. Santangelo"
  site-url: https://agapitosantangelo.github.io
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  page-footer:
    center: "© 2026 Agapito Emanuele Santangelo"

format:
  html:
    theme:
      - litera
      - theme/custom.scss
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
    include-after-body:
      text: |
        <script src="/assets/js/filters.js" defer></script>
        <script src="/assets/js/reveal.js" defer></script>

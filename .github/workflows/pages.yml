name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Non annullare un deploy in corso: con la coda di Pages lenta,
# annullare farebbe ripartire l'attesa da zero.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.primo.outputs.page_url || steps.secondo.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # il sito pubblicato è l'output Quarto committato nel repo
          path: site/_site

      # GitHub a volte elenca l'artefatto appena caricato con 0,5-46 secondi di
      # ritardo ("No artifacts named github-pages", issue aperta di deploy-pages).
      # Si aspetta, e se non basta si riprova una volta.
      - run: sleep 20

      - id: primo
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # Il workflow gestito da GitHub si arrende dopo 10 minuti (600000 ms).
          # Qui aspettiamo fino a 30 minuti perché la coda di Pages si liberi.
          timeout: 1800000

      - if: steps.primo.outcome == 'failure'
        run: sleep 60

      - id: secondo
        if: steps.primo.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

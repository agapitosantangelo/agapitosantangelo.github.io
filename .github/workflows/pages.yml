name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Non annullare un deploy in corso: con la coda di Pages lenta,
# annullare farebbe ripartire l'attesa da zero.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # il sito pubblicato è l'output Quarto committato nel repo
          path: site/_site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Il workflow gestito da GitHub si arrende dopo 10 minuti (600000 ms).
          # Qui aspettiamo fino a 30 minuti perché la coda di Pages si liberi.
          timeout: 1800000
